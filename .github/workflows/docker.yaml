name: Create Docker Image
on:
    release:
        types:
            - published
    workflow_dispatch:

# pgmanager, beside PostgreSQL, on docker-postgres's image, for each of its
# PostgreSQL versions, and each architecture. Each version's image is
# <version>-<pg>, such as 1.5.0-17-bookworm, and <pg>, such as 17-bookworm,
# for the latest, and latest is 17-bookworm.
env:
    DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/pgmanager
    DOCKER_SOURCE: github.com/${{ github.repository }}
    LATEST: 17-bookworm

jobs:
    build:
        name: Build
        strategy:
            matrix:
                arch: [amd64, arm64]
                pg: [17-bookworm, 18-trixie]
        runs-on:
            ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || matrix.arch == 'arm64'
            && 'ubuntu-24.04-arm' }}
        env:
            OS: linux
            ARCH: ${{ matrix.arch }}
            PG_VERSION: ${{ matrix.pg }}
            # The web UI installs @mutablelogic/go-server from GitHub Packages
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        outputs:
            tag: ${{ steps.build.outputs.tag }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: Install build tools
              run: |
                  sudo apt -y update
                  sudo apt -y install build-essential git
                  git config --global advice.detachedHead false
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  submodules: recursive
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and Push
              id: build
              run: |
                  make docker && make docker-push && make docker-version >> "$GITHUB_OUTPUT"
    manifest:
        name: Manifest
        needs: build
        strategy:
            matrix:
                pg: [17-bookworm, 18-trixie]
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Create, annotate and push
              env:
                  VERSION: ${{ needs.build.outputs.tag }}
                  PG: ${{ matrix.pg }}
              run: |
                  TAGS="${VERSION}-${PG} ${PG}"
                  if [ "${PG}" = "${LATEST}" ]; then TAGS="${TAGS} latest"; fi
                  for TAG in ${TAGS}; do
                      docker manifest create ${DOCKER_REPO}:${TAG} \
                          --amend ${DOCKER_REPO}:${VERSION}-${PG}-linux-amd64 \
                          --amend ${DOCKER_REPO}:${VERSION}-${PG}-linux-arm64
                      docker manifest annotate --arch amd64 --os linux ${DOCKER_REPO}:${TAG} ${DOCKER_REPO}:${VERSION}-${PG}-linux-amd64
                      docker manifest annotate --arch arm64 --os linux ${DOCKER_REPO}:${TAG} ${DOCKER_REPO}:${VERSION}-${PG}-linux-arm64
                      docker manifest push ${DOCKER_REPO}:${TAG}
                  done
